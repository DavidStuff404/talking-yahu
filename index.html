 out.connect(comp);comp.connect(an);an.connect(ctx.destination);
 let ended=0;
 [0.8].forEach(r=>{
  const s=ctx.createBufferSource();s.buffer=buf;s.playbackRate.value=r;s.connect(out);
  s.onended=()=>{if(++ended===1){playing=false;pose='idle';ignoreUntil=performance.now()+TAIL_IGNORE;boostUntil=ignoreUntil+1000}};
  s.start();
 });
 (function tick(){
  if(!playing)return;
  setMouth(rms(d,an)>0.02);          // mouth only moves while HE talks
  requestAnimationFrame(tick);
 })();
}
